#:schema https://www.schemastore.org/prek.json

fail_fast = false

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-xml" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files" },
  { id = "check-symlinks" },
  { id = "check-illegal-windows-names" },
  { id = "check-merge-conflict", args = ["--assume-in-merge"] },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending" },
  { id = "detect-private-key" },
  { id = "destroyed-symlinks" },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.10.0"
hooks = [
  { id = "tombi-format", args = ["--offline"], exclude = '(^|/)Cargo\.lock$' },
  { id = "tombi-lint", args = ["--offline"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-check"
name = "cargo check"
description = "Check the package for errors."
entry = "cargo check --all"
language = "system"
files = '(\.rs$|(^|/)(Cargo\.(toml|lock)|rust-toolchain(\.toml)?)$|^\.cargo/config(\.toml)?$)'
pass_filenames = false

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
description = "Format files with rustfmt."
entry = "cargo fmt --all -- --check"
language = "system"
files = '(\.rs$|(^|/)\.?rustfmt\.toml$)'
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
description = "Lint rust sources"
entry = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
language = "system"
files = '(\.rs$|(^|/)(Cargo\.(toml|lock)|rust-toolchain(\.toml)?)$|^\.cargo/config(\.toml)?$)'
pass_filenames = false

[[repos.hooks]]
id = "cargo-test"
name = "cargo test"
entry = "cargo test"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "dart-format"
name = "dart format"
entry = "dart format"
language = "system"
types = ["dart"]

[[repos.hooks]]
id = "flutter-analyze"
name = "flutter analyze"
entry = "flutter analyze"
language = "system"
files = '(\.dart$|(^|/)(pubspec\.(yaml|lock)|analysis_options\.yaml)$)'
pass_filenames = false

[[repos.hooks]]
id = "flutter-test"
name = "flutter test"
entry = "flutter test"
language = "system"
pass_filenames = false
always_run = true
