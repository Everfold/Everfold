name: everfold
description: Everfold APP.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0

  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.4
  riverpod_annotation: ^4.0.7

  go_router: ^18.1.3

  dio: ^5.11.1
  dio_http2_adapter: ^2.9.0

  path_provider: ^2.1.6
  file_selector: ^1.1.0

  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  talker: ^5.2.0
  talker_flutter: ^5.2.0
  talker_riverpod_logger: ^5.2.0
  talker_dio_logger: ^5.2.0

  flutter_localizations:
    sdk: flutter
  intl: any

  material_ui: ^1.10.0
  cupertino_ui: ^1.1.6
  cupertino_icons: ^2.0.0
  path: ^1.9.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.2
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  generate: true
