name: everfold
description: Everfold APP.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0

  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.4
  riverpod_annotation: ^4.0.7

  go_router: ^18.1.3
  markdown: ^7.3.1
  characters: ^1.4.1
  flutter_svg: ^2.3.2

  dio: ^5.11.1
  dio_http2_adapter: ^2.9.0

  file_selector: ^1.1.0
  cross_file: ^0.3.5+5
  path: ^1.9.1
  path_provider: ^2.1.6
  xdg_directories: ^1.1.0

  animations: ^3.0.0
  quick_actions: ^1.1.1
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1

  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  talker: ^5.2.0
  talker_flutter: ^5.2.0
  talker_riverpod_logger: ^5.2.0
  talker_dio_logger: ^5.2.0

  window_manager: ^0.6.0
  tray_manager: ^0.8.3
  hotkey_manager: ^0.3.0

  flutter_localizations:
    sdk: flutter
  intl: any

  material_ui: ^1.10.0
  a2ui_core: ^0.5.0
  a2ui_flutter: ^0.1.0
  dynamic_color: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.9
  go_router_builder: ^4.5.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/icon.svg
